<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>報到系統</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e3e6ea;--ac:#2563eb;--ok:#16a34a;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2026;--tx:#eceff3;--mu:#98a1ad;--bd:#2c333b;--ac:#5b8def;--ok:#34d399;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2026;--tx:#eceff3;--mu:#98a1ad;--bd:#2c333b;--ac:#5b8def;--ok:#34d399;--bad:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0}
input[type=text],textarea{flex:1}
textarea{width:100%;min-height:110px}
button{font:inherit;border:0;border-radius:8px;padding:8px 12px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button.g.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.d{background:none;color:var(--bad);padding:4px 8px}
button.s{background:none;padding:4px 8px;font-size:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{text-align:center;background:var(--bg);border-radius:10px;padding:8px 4px}
.stat b{display:block;font-size:20px}.stat span{color:var(--mu);font-size:12px}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.p{border-top:1px solid var(--bd);padding:10px 0}.p:first-child{border-top:0}
.nm{font-weight:600;font-size:17px}.mu{color:var(--mu);font-size:12px}
.tag{font-size:13px;padding:2px 10px;border-radius:99px;border:1px solid var(--ok);color:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
details summary{cursor:pointer;color:var(--mu)}
#msg{color:var(--ok);min-height:20px;margin-top:6px}
</style>
</head>
<body>
<main>
<h1>✅ 報到系統</h1>

<div class="card">
  <div class="row" style="margin-bottom:8px">
    <select id="evs" style="flex:1"></select>
    <button class="g" id="evnew">＋新活動</button>
    <button class="g" id="evdel">刪除活動</button>
  </div>
  <div class="row">
    <input type="text" id="ev" placeholder="活動名稱">
    <label class="mu">每人費用 $<input type="number" id="fee" min="0" style="width:90px"></label>
  </div>
  <div class="row" style="margin-top:8px">
    <input type="text" id="venue" placeholder="球館名稱（例：飛爾運動館）">
    <input type="text" id="courts" placeholder="場地（例：1、2、3、4號場）">
  </div>
</div>

<div class="card stats">
  <div class="stat"><b id="s1"></b><span>已報到</span><div class="bar"><i id="b1"></i></div></div>
  <div class="stat"><b id="s2"></b><span>未報到</span></div>
  <div class="stat"><b id="s3"></b><span>已收金額</span></div>
</div>

<div class="card">
  <b>貼上名單</b> <span class="mu">直接貼 LINE 公告，自動辨識編號、費用、場地</span>
  <textarea id="bulk" placeholder="場地：飛爾運動館&#10;日期：11/14（六）&#10;費用：$250&#10;參加名單：&#10;01.聖&#10;02.儒&#10;03.昇（維友）"></textarea>
  <div class="row" style="margin-top:6px"><button id="imp">匯入全部名單</button></div>
  <div id="msg"></div>
</div>

<div class="card">
  <details><summary>⭐ 固定名單（<span id="rc">0</span> 人）</summary>
    <p class="mu">點名字切換是否本場出席（藍色＝出席），再按「加入本場」。</p>
    <div class="chips" id="rost"></div>
    <div class="row" style="margin-top:8px">
      <button id="radd">加入本場</button>
      <button class="g" id="rall">全選</button>
      <button class="g" id="rnone">全不選</button>
    </div>
    <p class="mu" style="margin-bottom:4px">編輯固定名單（一行一人；也可按下方名單的 ☆ 加入）</p>
    <textarea id="rtxt" style="min-height:80px"></textarea>
    <button class="g" id="rsave" style="margin-top:6px">儲存固定名單</button>
  </details>
</div>

<div class="card">
  <div class="row">
    <input type="text" id="nn" placeholder="現場新增：姓名">
    <input type="text" id="nt" placeholder="備註" style="max-width:120px">
    <button id="add">新增</button>
  </div>
</div>

<div class="card">
  <input type="text" id="q" placeholder="🔍 搜尋姓名" style="width:100%;margin-bottom:8px">
  <div class="chips" id="chips"></div>
  <div id="list" style="margin-top:6px"></div>
</div>

<div class="card">
  <details><summary>更多：匯出／連結／清空</summary>
    <textarea id="out" style="min-height:70px;margin-top:8px"></textarea>
    <div class="row" style="margin-top:6px">
      <button class="g" id="exp">產生 CSV</button>
      <button class="g" id="lnk">產生名單連結</button>
      <button class="g" id="rst">清空本場名單</button>
    </div>
  </details>
</div>
</main>

<script>
const IK="checkin-idx",RK="checkin-roster";
let I={cur:"",list:[]},S={ev:"",fee:0,people:[]},R=[],off=new Set(),filter="all",armed=null,armedEv=false,armedAll=false;
const $=id=>document.getElementById(id);
const rd=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
const fmtT=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const save=()=>{wr("checkin-e:"+I.cur,S);const m=I.list.find(x=>x.id===I.cur);if(m)m.name=S.ev||"未命名活動";wr(IK,I)};
function newEv(){const id=uid();I.cur=id;I.list.push({id,name:"未命名活動"});S={ev:"",fee:0,people:[]};return id}
function load(id){I.cur=id;S=Object.assign({ev:"",fee:0,people:[]},rd("checkin-e:"+id));wr(IK,I)}
function msg(t){$("msg").textContent=t;setTimeout(()=>{$("msg").textContent=""},5000)}

function parse(t){
  const o={fee:0,ev:"",p:[]};
  const f=t.match(/費用[:：]\s*\$?\s*(\d+)/);if(f)o.fee=+f[1];
  let v=null,c=null;(t.match(/(?:場地|地點)[:：][^\n]*/g)||[]).forEach(l=>{const x=l.split(/[:：]/)[1].trim();if(!x)return;if(/號場/.test(x)||/^[\d一二三四五六七八九十]/.test(x)){if(!c)c=x.replace(/[號場\s]+$/,"")+"號場"}else if(!v)v=x.split(/\s+/)[0]});if(!c){const m=t.match(/([\d一二三四五六七八九十][\d一二三四五六七八九十、,，~\-]*)\s*號場/);if(m)c=m[1]+"號場"}const d=t.match(/日期[:：]\s*(\d{1,2}\/\d{1,2})/);
  if(v){o.venue=v;o.ev=v+(d?" "+d[1]:"")}if(c)o.courts=c;
  let wl=false,found=false;const lines=t.split(/\r?\n/);
  lines.forEach(l=>{
    if(/候補/.test(l))wl=true;
    const m=/號場/.test(l)?null:l.match(/^\s*\d{1,3}\s*[.、．)）]\s*(.*?)\s*$/);if(!m)return;found=true;
    let n=m[1],note="";const q=n.match(/^(.*?)\s*[（(]\s*(.+?)\s*[)）]\s*$/);
    if(q){n=q[1];note=q[2]}
    n=n.trim();if(!n)return;o.p.push([n,note||(wl?"候補":"")]);
  });
  if(!found)lines.forEach(l=>{const a=l.split(/[,，\t]/);if(a[0]&&a[0].trim()&&!/[:：]/.test(a[0]))o.p.push([a[0].trim(),(a[1]||"").trim()])});
  return o;
}
function addMany(arr){
  const ex={};S.people.forEach(p=>ex[p.name]=(ex[p.name]||0)+1);let n=0;
  arr.forEach(([name,note])=>{if(ex[name]>0){ex[name]--;return}S.people.push({id:uid(),name,note:note||"",at:0,paid:0});n++});
  return n;
}
function importHash(){
  const m=location.hash.match(/d=([^&]+)/);if(!m)return;
  try{const o=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,"+").replace(/_/g,"/")))));
    newEv();S.ev=o.n||"匯入的活動";S.fee=o.f||0;S.venue=o.v||"";S.courts=o.c||"";addMany(o.p);save();
    history.replaceState(null,"",location.pathname+location.search)}catch(e){}
}
function syncRoster(){$("rtxt").value=R.join("\n")}

const FILTERS=[["all","全部"],["nci","未報到"],["ci","已報到"]];
function render(){
  $("ev").value=S.ev;$("fee").value=S.fee||"";$("venue").value=S.venue||"";$("courts").value=S.courts||"";
  $("evs").innerHTML=I.list.map(x=>`<option value="${x.id}" ${x.id===I.cur?"selected":""}>${esc(x.name)}</option>`).join("");
  $("evdel").textContent=armedEv?"⚠ 再按一次確定":"刪除活動";
  const n=S.people.length,ci=S.people.filter(p=>p.at).length,got=S.people.reduce((a,p)=>a+(p.paid||0),0);
  $("s1").textContent=ci+"/"+n;$("b1").style.width=(n?ci/n*100:0)+"%";
  $("s2").textContent=n-ci;$("s3").textContent="$"+got.toLocaleString();
  $("rc").textContent=R.length;
  $("rost").innerHTML=R.map(x=>`<button class="g ${off.has(x)?"":"on"}" data-r="${esc(x)}">${esc(x)}</button>`).join("")||'<span class="mu">尚無固定名單</span>';
  $("chips").innerHTML=FILTERS.map(([k,l])=>`<button class="g ${k===filter?"on":""}" data-f="${k}">${l}</button>`).join("");
  const q=$("q").value.trim().toLowerCase();
  const rows=S.people.filter(p=>(!q||(p.name+p.note).toLowerCase().includes(q))&&{all:1,nci:!p.at,ci:p.at}[filter]);
  $("list").innerHTML=rows.length?rows.map(p=>`
  <div class="p" data-id="${p.id}">
    <div class="row" style="justify-content:space-between">
      <div><span class="nm">${esc(p.name)}</span> <span class="mu">${esc(p.note)}</span></div>
      <div><button class="s" data-a="star">${R.includes(p.name)?"⭐":"☆"}</button><button class="d" data-a="del">${armed===p.id?"⚠ 再按一次刪除":"刪除"}</button></div>
    </div>
    <div class="row" style="margin-top:4px">${p.at
      ?`<span class="tag">已報到 ${fmtT(p.at)} · ${p.paid?"已收 $"+p.paid:"免收費"}</span><button class="g" data-a="undo">取消</button>`
      :`<button data-a="in" style="flex:1">報到收費 $${S.fee||0}</button><button class="g" data-a="free">免收費報到</button>`}</div>
  </div>`).join(""):'<div class="mu" style="padding:12px;text-align:center">沒有符合的名單</div>';
}

$("list").addEventListener("click",e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;
  const p=S.people.find(x=>x.id===b.closest(".p").dataset.id);if(!p)return;const a=b.dataset.a;
  if(a==="in"){p.at=Date.now();p.paid=S.fee||0}
  else if(a==="free"){p.at=Date.now();p.paid=0}
  else if(a==="undo"){p.at=0;p.paid=0}
  else if(a==="star"){R=R.includes(p.name)?R.filter(x=>x!==p.name):R.concat(p.name);wr(RK,R);syncRoster()}
  else if(a==="del"){
    if(armed!==p.id){armed=p.id;render();setTimeout(()=>{if(armed===p.id){armed=null;render()}},3000);return}
    armed=null;S.people=S.people.filter(x=>x!==p)}
  save();render();
});
$("chips").addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(b){filter=b.dataset.f;render()}});
$("q").addEventListener("input",render);
$("ev").addEventListener("input",e=>{S.ev=e.target.value;save()});
$("venue").addEventListener("input",e=>{S.venue=e.target.value;save()});
$("courts").addEventListener("input",e=>{S.courts=e.target.value;save()});
$("fee").addEventListener("change",e=>{S.fee=Math.max(0,+e.target.value||0);save();render()});
$("imp").addEventListener("click",()=>{
  const o=parse($("bulk").value);if(!o.p.length){msg("找不到名單，請確認內容");return}
  if(o.fee)S.fee=o.fee;if(o.ev&&!S.ev)S.ev=o.ev;if(o.venue&&!S.venue)S.venue=o.venue;if(o.courts&&!S.courts)S.courts=o.courts;
  const n=addMany(o.p),sk=o.p.length-n;
  $("bulk").value="";msg("已匯入 "+n+" 人"+(o.fee?"，每人 $"+o.fee:"")+(sk?"，略過重複 "+sk+" 人":""));
  save();render();
});
$("add").addEventListener("click",()=>{
  const n=$("nn").value.trim();if(!n)return;addMany([[n,$("nt").value.trim()]]);
  $("nn").value=$("nt").value="";save();render();$("nn").focus();
});
$("nn").addEventListener("keydown",e=>{if(e.key==="Enter")$("add").click()});
$("rost").addEventListener("click",e=>{const b=e.target.closest("[data-r]");if(!b)return;const x=b.dataset.r;off.has(x)?off.delete(x):off.add(x);render()});
$("rall").addEventListener("click",()=>{off.clear();render()});
$("rnone").addEventListener("click",()=>{R.forEach(x=>off.add(x));render()});
$("radd").addEventListener("click",()=>{
  const n=addMany(R.filter(x=>!off.has(x)).map(x=>[x,""]));save();render();msg("已加入 "+n+" 人")
});
$("rsave").addEventListener("click",()=>{
  R=[...new Set($("rtxt").value.split("\n").map(s=>s.trim()).filter(Boolean))];wr(RK,R);syncRoster();render()
});
$("evs").addEventListener("change",e=>{save();load(e.target.value);render()});
$("evnew").addEventListener("click",()=>{save();newEv();save();render();$("ev").focus()});
$("evdel").addEventListener("click",()=>{
  if(!armedEv){armedEv=true;render();setTimeout(()=>{armedEv=false;render()},3000);return}
  armedEv=false;try{localStorage.removeItem("checkin-e:"+I.cur)}catch(e){}
  I.list=I.list.filter(x=>x.id!==I.cur);
  if(I.list.length)load(I.list[0].id);else{newEv();save()}
  render()
});
$("exp").addEventListener("click",()=>{
  const rows=[["姓名","備註","報到時間","已收"]].concat(S.people.map(p=>[p.name,p.note,p.at?new Date(p.at).toLocaleString("zh-TW"):"",p.paid||0]));
  $("out").value=rows.map(r=>r.map(c=>/[",\n]/.test(c)?'"'+String(c).replace(/"/g,'""')+'"':c).join(",")).join("\n");
  $("out").select();try{navigator.clipboard.writeText($("out").value)}catch(e){}
});
$("lnk").addEventListener("click",()=>{
  const o={n:S.ev,f:S.fee,v:S.venue,c:S.courts,p:S.people.map(p=>[p.name,p.note])};
  const h=btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_");
  $("out").value=location.href.split("#")[0]+"#d="+h;$("out").select();
  try{navigator.clipboard.writeText($("out").value)}catch(e){}
});
$("rst").addEventListener("click",()=>{
  if(!armedAll){armedAll=true;$("rst").textContent="⚠ 再按一次確定清空";setTimeout(()=>{armedAll=false;$("rst").textContent="清空本場名單"},3000);return}
  armedAll=false;$("rst").textContent="清空本場名單";S.people=[];save();render()
});

R=rd(RK)||[];syncRoster();
I=rd(IK)||I;
if(!I.list.length){const old=rd("checkin-v1");newEv();if(old)S=Object.assign(S,old);save()}else load(I.list.find(x=>x.id===I.cur)?I.cur:I.list[0].id);
importHash();
render();
</script>
</body>
</html>
