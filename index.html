<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>報到系統</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e3e6ea;--ac:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2026;--tx:#eceff3;--mu:#98a1ad;--bd:#2c333b;--ac:#5b8def;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2026;--tx:#eceff3;--mu:#98a1ad;--bd:#2c333b;--ac:#5b8def;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0}
input[type=text],input[type=number],textarea{flex:1}
textarea{width:100%;min-height:90px}
button{font:inherit;border:0;border-radius:8px;padding:8px 12px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button.d{background:none;color:var(--bad);padding:4px 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{text-align:center;background:var(--bg);border-radius:10px;padding:8px 4px}
.stat b{display:block;font-size:18px}.stat span{color:var(--mu);font-size:12px}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.p{border-top:1px solid var(--bd);padding:10px 0}
.p:first-child{border-top:0}
.nm{font-weight:600;font-size:16px}.mu{color:var(--mu);font-size:12px}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid}
.t-ok{color:var(--ok)}.t-no{color:var(--mu)}.t-w{color:var(--warn)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{white-space:nowrap}.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
details summary{cursor:pointer;color:var(--mu)}
.pay input{width:90px;flex:none}
</style>
</head>
<body>
<main>
<h1>✅ 報到系統</h1>

<div class="card">
  <div class="row" style="margin-bottom:8px">
    <select id="evs" style="flex:1"></select>
    <button class="g" id="evnew">＋新活動</button>
    <button class="g" id="evdel">刪除活動</button>
  </div>
  <div class="row">
    <input type="text" id="ev" placeholder="活動名稱">
    <label class="mu">預設費用 <input type="number" id="fee" value="0" min="0" style="width:90px"></label>
  </div>
</div>

<div class="card stats">
  <div class="stat"><b id="s1">0/0</b><span>已報到</span><div class="bar"><i id="b1" style="width:0"></i></div></div>
  <div class="stat"><b id="s2">0/0</b><span>已繳費</span><div class="bar"><i id="b2" style="width:0"></i></div></div>
  <div class="stat"><b id="s3">0</b><span>已收 / 應收</span><div class="mu" id="s3b"></div></div>
</div>

<div class="card">
  <div class="row">
    <input type="text" id="nn" placeholder="姓名">
    <input type="text" id="nt" placeholder="備註（電話、組別…）">
    <input type="number" id="nd" placeholder="應繳" min="0" style="width:90px;flex:none">
    <button id="add">新增</button>
  </div>
  <details style="margin-top:8px"><summary>批次匯入 / 匯出</summary>
    <p class="mu">每行一人：姓名,備註,應繳金額（後兩項可省略）</p>
    <input type="file" id="file" accept=".csv,.txt" style="width:100%;margin-bottom:6px">
    <textarea id="bulk" placeholder="王小明,A組,500&#10;李小華"></textarea>
    <div class="row" style="margin-top:6px">
      <button id="imp">匯入名單</button>
      <button class="g" id="lnk">產生名單連結</button>
      <button class="g" id="exp">產生 CSV</button>
      <button class="g" id="rst">清空全部</button>
    </div>
  </details>
</div>

<div class="card">
  <div class="row" style="margin-bottom:8px">
    <input type="text" id="q" placeholder="🔍 搜尋姓名／備註">
  </div>
  <div class="chips" id="chips"></div>
  <div id="list" style="margin-top:6px"></div>
</div>
</main>

<script>
const IK="checkin-idx";
let I={cur:"",list:[]};
let S={ev:"",fee:0,people:[]},filter="all",armed=null,armedAll=false,armedEv=false;
const $=id=>document.getElementById(id);
const rd=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const save=()=>{wr("checkin-e:"+I.cur,S);const m=I.list.find(x=>x.id===I.cur);if(m)m.name=S.ev||"未命名活動";wr(IK,I)};
function newEv(){const id=uid();I.cur=id;I.list.push({id,name:"未命名活動"});S={ev:"",fee:0,people:[]};return id}
function load(id){I.cur=id;S=Object.assign({ev:"",fee:0,people:[]},rd("checkin-e:"+id));wr(IK,I)}
function importHash(){
  const m=location.hash.match(/d=([^&]+)/);if(!m)return;
  try{const o=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,"+").replace(/_/g,"/")))));
    newEv();S.ev=o.n||"匯入的活動";S.fee=o.f||0;o.p.forEach(r=>addPerson(r[0],r[1],r[2]));save();
    history.replaceState(null,"",location.pathname+location.search)}catch(e){}
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtT=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const FILTERS=[["all","全部"],["nci","未報到"],["ci","已報到"],["np","未繳費"],["pd","已繳費"]];

function addPerson(name,note,due){
  name=name.trim();if(!name)return;
  S.people.push({id:uid(),name,note:(note||"").trim(),due:+due||0,paid:0,at:0});
}
const owe=p=>Math.max(0,p.due-p.paid);
const isPaid=p=>p.due>0?p.paid>=p.due:p.paid>0;

function render(){
  $("ev").value=S.ev;$("fee").value=S.fee;
  $("evs").innerHTML=I.list.map(x=>`<option value="${x.id}" ${x.id===I.cur?"selected":""}>${esc(x.name)}</option>`).join("");
  $("evdel").textContent=armedEv?"⚠ 再按一次確定":"刪除活動";
  const n=S.people.length,ci=S.people.filter(p=>p.at).length,pd=S.people.filter(p=>p.due>0&&isPaid(p)).length,
    payN=S.people.filter(p=>p.due>0).length,got=S.people.reduce((a,p)=>a+p.paid,0),due=S.people.reduce((a,p)=>a+p.due,0);
  $("s1").textContent=ci+"/"+n;$("b1").style.width=(n?ci/n*100:0)+"%";
  $("s2").textContent=pd+"/"+payN;$("b2").style.width=(payN?pd/payN*100:0)+"%";
  $("s3").textContent=got.toLocaleString();$("s3b").textContent="應收 "+due.toLocaleString()+"　欠 "+Math.max(0,due-got).toLocaleString();
  $("chips").innerHTML=FILTERS.map(([k,l])=>`<button class="g ${k===filter?"on":""}" data-f="${k}">${l}</button>`).join("");
  const q=$("q").value.trim().toLowerCase();
  const rows=S.people.filter(p=>{
    if(q&&!(p.name+p.note).toLowerCase().includes(q))return false;
    return {all:1,nci:!p.at,ci:p.at,np:p.due>0&&!isPaid(p),pd:isPaid(p)}[filter];
  });
  $("list").innerHTML=rows.length?rows.map(p=>`
  <div class="p" data-id="${p.id}">
    <div class="row" style="justify-content:space-between">
      <div><span class="nm">${esc(p.name)}</span> <span class="mu">${esc(p.note)}</span></div>
      <button class="d" data-a="del">${armed===p.id?"⚠ 再按一次確定刪除":"刪除"}</button>
    </div>
    <div class="row" style="margin-top:6px">
      <button data-a="ci" class="${p.at?"g":""}">${p.at?"↩ 取消報到":"報到"}</button>
      <span class="tag ${p.at?"t-ok":"t-no"}">${p.at?"已報到 "+fmtT(p.at):"未報到"}</span>
    </div>
    <div class="row pay" style="margin-top:6px">
      <span class="mu">應繳</span><input type="number" min="0" value="${p.due}" data-a="due">
      <span class="mu">已繳</span><input type="number" min="0" value="${p.paid}" data-a="paid">
      <button class="g" data-a="full">全額</button>
      <span class="tag ${isPaid(p)?"t-ok":p.paid>0?"t-w":"t-no"}">${isPaid(p)?"已繳清":p.paid>0?"欠 "+owe(p):p.due>0?"未繳":"無須繳費"}</span>
    </div>
  </div>`).join(""):'<div class="mu" style="padding:12px;text-align:center">沒有符合的名單</div>';
}

$("list").addEventListener("click",e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;
  const el=b.closest(".p"),p=S.people.find(x=>x.id===el.dataset.id);if(!p)return;
  const a=b.dataset.a;
  if(a==="ci")p.at=p.at?0:Date.now();
  else if(a==="full")p.paid=p.due;
  else if(a==="del"){
    if(armed!==p.id){armed=p.id;render();setTimeout(()=>{if(armed===p.id){armed=null;render()}},3000);return}
    armed=null;S.people=S.people.filter(x=>x!==p)}
  save();render();
});
$("list").addEventListener("change",e=>{
  const i=e.target.closest("input[data-a]");if(!i)return;
  const p=S.people.find(x=>x.id===i.closest(".p").dataset.id);
  p[i.dataset.a]=Math.max(0,+i.value||0);save();render();
});
$("chips").addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(b){filter=b.dataset.f;render()}});
$("q").addEventListener("input",render);
$("ev").addEventListener("input",e=>{S.ev=e.target.value;save()});
$("fee").addEventListener("input",e=>{S.fee=+e.target.value||0;save();$("nd").placeholder="應繳（預設 "+S.fee+"）"});
$("add").addEventListener("click",()=>{
  const d=$("nd").value;
  addPerson($("nn").value,$("nt").value,d===""?S.fee:d);
  $("nn").value=$("nt").value=$("nd").value="";save();render();$("nn").focus();
});
$("nn").addEventListener("keydown",e=>{if(e.key==="Enter")$("add").click()});
$("imp").addEventListener("click",()=>{
  $("bulk").value.split("\n").forEach(l=>{
    const [n,t,d]=l.split(/[,，\t]/);
    if(n&&n.trim()&&n.trim()!=="姓名")addPerson(n,t,d===undefined||d.trim()===""?S.fee:d);
  });
  $("bulk").value="";save();render();
});
$("exp").addEventListener("click",()=>{
  const rows=[["姓名","備註","報到時間","應繳","已繳"]].concat(S.people.map(p=>[p.name,p.note,p.at?new Date(p.at).toLocaleString("zh-TW"):"",p.due,p.paid]));
  $("bulk").value=rows.map(r=>r.map(c=>/[",\n]/.test(c)?'"'+String(c).replace(/"/g,'""')+'"':c).join(",")).join("\n");
  $("bulk").select();
  try{navigator.clipboard.writeText($("bulk").value)}catch(e){}
});
$("rst").addEventListener("click",()=>{
  if(!armedAll){armedAll=true;$("rst").textContent="⚠ 再按一次確定清空";setTimeout(()=>{armedAll=false;$("rst").textContent="清空全部"},3000);return}
  armedAll=false;$("rst").textContent="清空全部";S.people=[];save();render()
});
$("evs").addEventListener("change",e=>{save();load(e.target.value);render()});
$("evnew").addEventListener("click",()=>{save();newEv();save();render();$("ev").focus()});
$("evdel").addEventListener("click",()=>{
  if(!armedEv){armedEv=true;render();setTimeout(()=>{armedEv=false;render()},3000);return}
  armedEv=false;try{localStorage.removeItem("checkin-e:"+I.cur)}catch(e){}
  I.list=I.list.filter(x=>x.id!==I.cur);
  if(I.list.length)load(I.list[0].id);else{newEv();save()}
  render()
});
$("file").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("bulk").value=r.result.replace(/^\uFEFF/,"")};r.readAsText(f,"utf-8")});
$("lnk").addEventListener("click",()=>{
  const o={n:S.ev,f:S.fee,p:S.people.map(p=>[p.name,p.note,p.due])};
  const h=btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_");
  $("bulk").value=location.href.split("#")[0]+"#d="+h;$("bulk").select();
  try{navigator.clipboard.writeText($("bulk").value)}catch(e){}
});
I=rd(IK)||I;
if(!I.list.length){const old=rd("checkin-v1");newEv();if(old)S=Object.assign(S,old);save()}else load(I.list.find(x=>x.id===I.cur)?I.cur:I.list[0].id);
importHash();
$("nd").placeholder="應繳（預設 "+S.fee+"）";
render();
</script>
</body>
</html>
